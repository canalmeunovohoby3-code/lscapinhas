<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2E3639" />
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('lscase:public-theme');
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>LS Case by LS Celulares | Sua capa, seu estilo</title>
    <meta
      name="description"
      content="Capinhas personalizadas para deixar seu celular com a sua identidade. Encontre a capinha perfeita para o seu modelo e fale com a LS Case pelo WhatsApp."
    />
    <meta property="og:title" content="LS Case by LS Celulares | Sua capa, seu estilo" />
    <meta
      property="og:description"
      content="Capinhas que combinam com você. Escolha seu celular, encontre seu estilo e monte seu pedido."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
